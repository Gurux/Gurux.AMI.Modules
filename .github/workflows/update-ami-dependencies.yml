name: Update AMI dependencies

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [ami-dependency-published]
  pull_request:

permissions:
  contents: read

jobs:
  update-dependencies:
    # Manual runs may select a branch: never give PR/feature code write credentials.
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    timeout-minutes: 45
    concurrency:
      group: ami-dependency-update
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: pwsh
    env:
      UPDATE_BRANCH: chore/ami-dependency-updates
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Test dependency automation
        run: |
          python scripts/test_ami_dependencies.py
          if ($LASTEXITCODE -ne 0) { throw 'Dependency automation tests failed' }
      - name: Update references, refresh locks and verify affected modules and tests
        id: update
        run: |
          $ErrorActionPreference = 'Stop'
          $resultPath = Join-Path $env:RUNNER_TEMP 'ami-dependency-update-result.json'
          ./scripts/update_ami_dependencies.ps1 -Mode Update -RepositoryRoot $env:GITHUB_WORKSPACE -ResultPath $resultPath
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          "changed=$($result.changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $result.prBody >> $env:GITHUB_STEP_SUMMARY
      - name: Maintain one dependency pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $result = Get-Content (Join-Path $env:RUNNER_TEMP 'ami-dependency-update-result.json') -Raw | ConvertFrom-Json
          $bodyPath = Join-Path $env:RUNNER_TEMP 'ami-dependency-pr-body.md'
          [IO.File]::WriteAllText($bodyPath, [string]$result.prBody)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          $remoteBranch = @(git ls-remote --heads origin "refs/heads/$env:UPDATE_BRANCH")
          if ($remoteBranch.Count -gt 0) {
            git fetch origin "+refs/heads/${env:UPDATE_BRANCH}:refs/remotes/origin/${env:UPDATE_BRANCH}"
          }
          git checkout -B $env:UPDATE_BRANCH
          # Never stage arbitrary build outputs or unrelated files.
          foreach ($file in $result.filesChanged) { git add -- $file }
          $sameAsExisting = $false
          if ($remoteBranch.Count -gt 0) {
            $PSNativeCommandUseErrorActionPreference = $false
            git diff --cached --quiet "refs/remotes/origin/$env:UPDATE_BRANCH"
            $diffExit = $LASTEXITCODE
            $PSNativeCommandUseErrorActionPreference = $true
            if ($diffExit -gt 1) { throw 'Could not compare existing update branch' }
            $sameAsExisting = $diffExit -eq 0
          }
          if (-not $sameAsExisting) {
            git commit -m 'chore: update AMI Shared/Module dependencies'
            git push --force-with-lease origin "HEAD:refs/heads/$env:UPDATE_BRANCH"
          }
          $existing = gh pr list --repo $env:GITHUB_REPOSITORY --state open --base $env:DEFAULT_BRANCH --head $env:UPDATE_BRANCH --json number --jq '.[0].number'
          $title = 'chore: update AMI Shared/Module dependencies'
          if ([string]::IsNullOrWhiteSpace($existing)) {
            gh pr create --repo $env:GITHUB_REPOSITORY --base $env:DEFAULT_BRANCH --head $env:UPDATE_BRANCH --title $title --body-file $bodyPath
          } else {
            gh pr edit $existing --repo $env:GITHUB_REPOSITORY --title $title --body-file $bodyPath
          }

  validate-dependency-pr:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    concurrency:
      group: ami-dependency-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Test dependency automation
        run: |
          python scripts/test_ami_dependencies.py
          if ($LASTEXITCODE -ne 0) { throw 'Dependency automation tests failed' }
      - name: Verify AMI consumers, project-reference dependents and related tests
        run: ./scripts/update_ami_dependencies.ps1 -Mode Validate -RepositoryRoot $env:GITHUB_WORKSPACE
